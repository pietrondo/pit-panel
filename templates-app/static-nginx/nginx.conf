server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never serve dotfiles/dot-directories (e.g. /.git/config, /.env).
    # Regex locations win over the prefix location below.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
